<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Tela de Login</title>
</head>
<body>
    <h1>Tela de Login</h1>
    <div style="display: flex; flex-direction: column; max-width: 500px">
        <span>Digite seu nome de usuário:</span>
        <input typeof="text" placeholder="Nome de usuário">
        <span>Digite sua senha:</span>
        <input typeof="password" placeholder="Senha">
        <button>Entrar</button>
    </div>
</body>
</html>
